name: release
# Manual: Actions → release → Run workflow. Bumps the version, tags vX.Y.Z, pushes, publishes to npm, creates a
# GitHub Release. npm auth is trusted publishing (OIDC): no token; link this repo + release.yml on npmjs.com first.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        required: true
      branch:
        description: Release from (main is first fast-forwarded to dev; both end on the release commit)
        type: choice
        options: [dev, main]
        default: dev
concurrency: release
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ inputs.bump }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@11
      - name: Fast-forward main to dev
        if: inputs.branch == 'main'
        run: git checkout -B main origin/main && git merge --ff-only origin/dev
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - run: npm run smoke
      - name: Bump and tag
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "$BUMP" -m 'chore: release %s'
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      # Atomic: if dev or main moved during the run, nothing is pushed and nothing is published.
      - name: Push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          refs=(HEAD:dev "refs/tags/$TAG")
          if [ "$BRANCH" = main ]; then refs+=(HEAD:main); fi
          git push --atomic origin "${refs[@]}"
      - run: npm publish --provenance --access public
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes
